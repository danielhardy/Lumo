name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_FORMAT_CONFIGURATION: .swift-format

jobs:
  format:
    name: Swift-format (changed files)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed Swift files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            export SWIFT_FORMAT_BASE="origin/$GITHUB_BASE_REF"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            export SWIFT_FORMAT_BASE=HEAD^
          fi
          scripts/check-swift-format.sh

  tests-fast:
    name: Tests (deterministic, parallel)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-version) at $(xcrun --sdk macosx --show-sdk-path)"

      - name: Build (debug)
        run: swift build -v

      - name: Test deterministic lane
        run: >-
          swift test --parallel
          --skip '(MetalPresentationBenchmark|ConcurrentExportEditingBenchmark|PhotosImportPerformanceTests|PreviewCostBenchmark|EditPersistenceBenchmarkTests|TracingOverheadBenchmark)'

      - name: Build (release)
        run: swift build -c release

  tests-slow:
    name: Tests (RAW and hardware lane)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show slow-lane policy
        run: |
          echo "RAW fixtures are external and privacy/licensing controlled."
          echo "Set LUMO_RAW_FIXTURE_DIR on a licensed local/self-hosted runner to exercise them."

      - name: Run RAW and hardware coverage
        run: >-
          swift test --parallel
          --filter '(RAWCapabilitiesTests|RAWDevelopSettingsTests|DeriveInvarianceTests|ImageLoadingTests|ImageSourceTests|RenderPipelineTests|RenderEngineTests|PreviewCutoverTests|MetalPresentationBenchmark|ConcurrentExportEditingBenchmark|PhotosImportPerformanceTests|PreviewCostBenchmark)'

  package:
    name: Package, sign, and verify app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-version) at $(xcrun --sdk macosx --show-sdk-path)"

      - name: Build app bundle
        run: scripts/build-macos-app.sh

      - name: Verify packaged assets and signature
        run: |
          scripts/verify-app-icon.sh
          scripts/verify-app-signature.sh

      - name: Assert packaging did not modify tracked source files
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Packaging changed or created repository files:"
            git status --short --untracked-files=all
            exit 1
          fi

  smoke:
    name: Application smoke path
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: scripts/build-macos-app.sh

      - name: Launch, open, Settings/menu, and export smoke path
        shell: bash
        run: |
          set +e
          scripts/smoke-macos-app.sh
          status=$?
          set -e
          if [[ "$status" == 2 ]]; then
            echo "Smoke path deferred: hosted runner has no accessible WindowServer session."
            exit 0
          fi
          exit "$status"
